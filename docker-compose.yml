version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartqueue-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    depends_on:
      - redis
    networks:
      - smartqueue-net
    volumes:
      - ./backend/uploads:/app/uploads

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: smartqueue-admin
    restart: unless-stopped
    ports:
      - '3000:80'
    networks:
      - smartqueue-net
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: smartqueue-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    networks:
      - smartqueue-net
    volumes:
      - redis-data:/data

  nginx:
    image: nginx:alpine
    container_name: smartqueue-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - admin-dashboard
    networks:
      - smartqueue-net

networks:
  smartqueue-net:
    driver: bridge

volumes:
  redis-data:
