services:
  # Redis Cache Service
  - type: redis
    name: smartqueue-redis
    plan: free
    ipAllowList: []

  # Backend API Web Service
  - type: web
    name: smartqueue-backend
    env: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter smartqueue-backend build
    startCommand: pnpm --filter smartqueue-backend start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService:
          name: smartqueue-redis
          type: redis
          property: connectionString

  # Frontend React Web Portal
  - type: web
    name: smartqueue-portal
    env: static
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter portal-web build
    staticPublishPath: portal-web/dist
    routes:
      - type: rewrite
        from: /*
        to: /index.html
