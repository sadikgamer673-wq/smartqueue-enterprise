name: Mobile Apps CI

on:
  push:
    branches: [main, develop]
    paths: ['customer-mobile/**', 'worker-mobile/**']
  pull_request:
    branches: [main, develop]
    paths: ['customer-mobile/**', 'worker-mobile/**']

jobs:
  typecheck-customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit

  typecheck-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
